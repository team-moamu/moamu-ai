name: AI CI and dev deploy

on:
  pull_request_target:
    types: [closed]
    branches: [develop]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ai-ci.yml'

permissions:
  contents: read

concurrency:
  group: ai-dev
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
  IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/moamu-ai

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AI image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SOURCE_SHA }}

      - name: Get deployment repository token
        id: deploy-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ vars.DEPLOY_REPO_OWNER }}
          repositories: moamu-deploy

      - name: Check out deployment repository
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.DEPLOY_REPO_OWNER }}/moamu-deploy
          token: ${{ steps.deploy-token.outputs.token }}
          ref: main
          path: moamu-deploy

      - name: Update AI development image
        working-directory: moamu-deploy/environments/dev/ai
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          kustomize edit set image "moamu-ai=${IMAGE}@${DIGEST}"
          kustomize build . >/dev/null
          git add kustomization.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name moamu-deploy-bot
          git config user.email moamu-deploy-bot@users.noreply.github.com
          git commit -m "Deploy AI ${SOURCE_SHA::12} to dev"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
